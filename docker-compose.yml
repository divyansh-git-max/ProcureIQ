version: "3.9"

# ─────────────────────────────────────────────
# ProcureIQ — Local Development Stack
#
# Services:
#   web     → FastAPI backend (port 8000)
#   worker  → Celery background task processor
#   redis   → Celery broker + API cache
#
# NOT included (external managed services):
#   postgres → NeonDB (set DATABASE_URL in .env)
#   pinecone → Serverless (set PINECONE_API_KEY in .env)
# ─────────────────────────────────────────────

services:

  # ── Redis ───────────────────────────────────
  # Used as: Celery broker + task result backend
  #          API rate-limit cache
  #          LangGraph checkpoint memory
  redis:
    image: redis:7-alpine
    container_name: procureiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Web Server ───────────────────────
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procureiq-web
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: mounts local source into container
      - ./backend:/app
      # Shared temp folder for document uploads
      - procureiq_tmp:/tmp/procureiq
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────
  # Processes background tasks:
  #   - OCR extraction
  #   - Document intelligence classification
  #   - Chunking + Pinecone upsert
  #   - Agent orchestration triggers
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procureiq-worker
    # Temporarily bypassing Celery start since tasks/worker.py doesn't have the app configured yet.
    # Change back to `celery -A tasks.worker worker --loglevel=info` once you write the worker code!
    command: tail -f /dev/null
    volumes:
      - ./backend:/app
      - procureiq_tmp:/tmp/procureiq
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  procureiq_tmp: