[project]
name = "procureiq-backend"
version = "0.1.0"
description = "Backend scaffold for ProcureIQ procurement intelligence."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "asyncpg>=0.29.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "openai>=1.40.0",
  "langchain>=0.2.0",
  "langgraph>=0.2.0",
  "qdrant-client>=1.10.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "groq>=0.9.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "langsmith>=0.1.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "passlib>=1.7.4",
  "bcrypt>=5.0.0",
  "pyjwt>=2.13.0",
  "pinecone>=9.1.0",
  "spacy>=3.8.14",
  "pytest-asyncio>=1.4.0",
  "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

