[project]
name = "procureiq-backend"
version = "0.1.0"
description = "Backend scaffold for ProcureIQ procurement intelligence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "openai>=1.40.0",
  "langchain>=0.2.0",
  "langgraph>=0.2.0",
  "qdrant-client>=1.10.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "langsmith>=0.1.0",
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

