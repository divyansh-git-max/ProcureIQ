events {
    worker_connections 1024;
}

http {
    # 1. Map X-User-Tier header to determine the rate limiting key.
    # By default, rate limit everyone by their client IP address ($binary_remote_addr).
    # If the user tier header is explicitly set to 'premium', return "" to bypass rate limiting.
    map $http_x_user_tier $free_tier_limit_key {
        "premium" "";
        default   $binary_remote_addr;
    }

    # 2. Define rate limit zone (35 requests per minute)
    limit_req_zone $free_tier_limit_key zone=free_tier_zone:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 80;

        location / {
            # Apply rate limit zone with a burst of 15 requests (instant execution)
            # This allows the dashboard to fire multiple API requests at once.
            limit_req zone=free_tier_zone burst=15 nodelay;

            # Proxy requests to FastAPI on your host machine
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Custom JSON error message for blocked requests
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            
            # Add CORS headers so the browser allows the React app to read the 429 error
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PATCH, DELETE";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-User-Tier";
            
            return 429 '{"detail": "Too many requests. Free tier limit exceeded. Upgrade to premium for unlimited access."}';
        }
    }
}