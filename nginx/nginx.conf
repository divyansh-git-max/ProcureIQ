events {
    worker_connections 1024;
}

http {
    # 1. Map X-User-Tier header to determine the rate limiting key.
    # By default, rate limit everyone by their client IP address ($binary_remote_addr).
    # If the user tier header is explicitly set to 'premium', return "" to bypass rate limiting.
    map $http_x_user_tier $free_tier_limit_key {
        "premium" "";
        default   $binary_remote_addr;
    }

    # 2. Define rate limit zone (6 requests per minute = 1 request every 10s for testing)
    limit_req_zone $free_tier_limit_key zone=free_tier_zone:10m rate=6r/m;
    limit_req_status 429;

    server {
        listen 80;

        location / {
            # Apply rate limit zone with a burst of 2 requests (instant execution)
            limit_req zone=free_tier_zone burst=2 nodelay;

            # Proxy requests to FastAPI on your host machine
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Custom JSON error message for blocked requests
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"detail": "Too many requests. Free tier limit exceeded. Upgrade to premium for unlimited access."}';
        }
    }
}